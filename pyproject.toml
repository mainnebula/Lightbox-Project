[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightbox"
version = "0.1.0"
description = "Flight recorder for AI agents - append-only, tamper-evident tool execution logs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Robert Keenan" }
]
keywords = ["ai", "agents", "logging", "langchain", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
all = [
    "lightbox[langchain,dev]",
]

[project.scripts]
lightbox = "lightbox.cli:main"

[project.urls]
Homepage = "https://github.com/robertkeenan/lightbox"
Repository = "https://github.com/robertkeenan/lightbox"

[tool.hatch.build.targets.wheel]
packages = ["src/lightbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/lightbox"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
